name: Build Fusion OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'build.sh'
      - 'config/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out Fusion OS build kit
        uses: actions/checkout@v4

      - name: Install Debian live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends live-build debootstrap xorriso squashfs-tools

      - name: Build Fusion OS live ISO
        run: sudo ./build.sh

      - name: Verify ISO output
        run: |
          shopt -s nullglob
          isos=( *.iso )
          if (( ${#isos[@]} == 0 )); then
            echo "Build completed without producing an ISO."
            exit 1
          fi
          ls -lh "${isos[@]}"
          sha256sum "${isos[@]}" | tee SHA256SUMS

      - name: Upload ISO build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fusion-os-live-iso
          path: |
            *.iso
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7
